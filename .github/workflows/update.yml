name: Actualitzar Notícies i Desplegar

on:
  schedule:
    # 08:00 hora de Catalunya durant tot l'any
    # - Estiu (CEST, UTC+2):  06:00 UTC, mesos 4-10
    # - Hivern (CET, UTC+1):  07:00 UTC, mesos 11-12 i 1-3
    - cron: '0 6 * * 4,5,6,7,8,9,10'
    - cron: '0 7 * * 1,2,3,11,12'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar actualització de notícies
        env:
          TRANSLATE_ENDPOINT: ${{ secrets.TRANSLATE_ENDPOINT }}
          TRANSLATION_EMAIL: ${{ secrets.TRANSLATION_EMAIL }}
        run: python update_news.py

      - name: Commit i push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git commit -m "Actualització de notícies - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "Cap canvi per commitejar"
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Pujar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4