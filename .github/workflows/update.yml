name: Actualitzar Notícies

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar actualització de notícies
        env:
          TRANSLATE_ENDPOINT: ${{ secrets.TRANSLATE_ENDPOINT }}
          TRANSLATION_EMAIL: ${{ secrets.TRANSLATION_EMAIL }}
        run: python update_news.py

      - name: Commit i push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news.json
          git commit -m "Actualització de notícies - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || echo "Cap canvi per commitejar"
          git push